{% extends "base.html" %}

{% block title %}401 — Authentication Required | AppManager{% endblock %}

{% block content %}
<div style="display:flex; justify-content:center; align-items:center; min-height:60vh;">
    <div class="card boot-item" style="max-width:500px; text-align:center; padding:2.5rem;">
        <div class="mono" style="font-size:4rem; font-weight:700; color:var(--accent); line-height:1; margin-bottom:0.5rem;">401</div>
        <h1 style="font-size:1.4rem; font-weight:600; margin-bottom:1rem;">Authentication Required</h1>
        <p class="text-muted" style="margin-bottom:2rem; line-height:1.6;">
            You must be logged into AppManager to access this protected application or feature.
        </p>
        <div class="flex-center" style="justify-content:center; gap:1rem;">
            <a href="/auth/login" class="btn btn-primary">Log In to Continue</a>
            <a href="/" class="btn btn-secondary">Return to Home</a>
        </div>
    </div>
</div>
{% endblock %}
