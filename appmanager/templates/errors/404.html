{% extends "base.html" %}

{% block title %}404 — Not Found | AppManager{% endblock %}

{% block content %}
<div style="display:flex; justify-content:center; align-items:center; min-height:60vh;">
    <div class="card boot-item" style="max-width:500px; text-align:center; padding:2.5rem;">
        <div class="mono" style="font-size:4rem; font-weight:700; color:var(--danger); line-height:1; margin-bottom:0.5rem;">404</div>
        <h1 style="font-size:1.4rem; font-weight:600; margin-bottom:1rem;">Page or App Not Found</h1>
        <p class="text-muted" style="margin-bottom:2rem; line-height:1.6;">
            The page or application you requested could not be located. It may have been uninstalled, moved, or the URL might be mistyped.
        </p>
        <div class="flex-center" style="justify-content:center;">
            <a href="/" class="btn btn-primary">Return to Home</a>
        </div>
    </div>
</div>
{% endblock %}
