[build-system]
requires = ["setuptools>=65.0.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "appmanager-server"
version = "0.2.1"
description = "Multi-tenant Flask sub-application portal & dynamic WSGI dispatcher with in-process isolation, telemetry, and automated health checks."
readme = "README.md"
authors = [
    { name = "AppManager Contributors" }
]
license = { text = "MIT" }
requires-python = ">=3.10"
keywords = [
    "flask",
    "wsgi",
    "multi-tenant",
    "sub-apps",
    "pythonanywhere",
    "dispatcher",
    "microfrontends",
    "portal",
    "appmanager"
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Web Environment",
    "Framework :: Flask",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Internet :: WWW/HTTP :: Dynamic Content",
    "Topic :: Internet :: WWW/HTTP :: WSGI :: Application",
    "Topic :: Software Development :: Libraries :: Application Frameworks"
]

dependencies = [
    "Flask>=3.0.0",
    "Flask-SQLAlchemy>=3.1.1",
    "blinker>=1.6.0",
    "PyJWT>=2.8.0",
    "requests>=2.31.0",
    "Authlib>=1.3.0",
    "GitPython>=3.1.41",
    "Werkzeug>=3.0.1",
    "python-dotenv>=1.0.0",
    "appmanager-sdk>=0.1.0"
]

[project.optional-dependencies]
mysql = [
    "PyMySQL>=1.1.0",
    "cryptography>=41.0.0"
]
postgres = [
    "psycopg2-binary>=2.9.0"
]
all = [
    "PyMySQL>=1.1.0",
    "cryptography>=41.0.0",
    "psycopg2-binary>=2.9.0"
]
dev = [
    "pytest>=8.0.0",
    "pytest-cov>=5.0.0",
    "ruff>=0.5.0",
    "build>=1.1.0",
    "twine>=5.0.0",
    "PyMySQL>=1.1.0"
]
docs = [
    "mkdocs-material>=9.5.0",
    "mkdocstrings[python]>=0.25.0",
    "pymdown-extensions>=10.7"
]

[project.urls]
Homepage = "https://github.com/r3sbarra/appmanager-server"
Documentation = "https://github.com/r3sbarra/appmanager-server#readme"
Repository = "https://github.com/r3sbarra/appmanager-server.git"
Issues = "https://github.com/r3sbarra/appmanager-server/issues"
Changelog = "https://github.com/r3sbarra/appmanager-server/blob/master/CHANGELOG.md"

[project.scripts]
appmanager-server = "appmanager.cli:main"
appmgr-server = "appmanager.cli:main"
appmanager = "appmanager.cli:main"
appmgr = "appmanager.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["appmanager*"]

[tool.setuptools.package-data]
appmanager = [
    "py.typed",
    "templates/**/*.html",
    "templates/*.html",
    "static/**/*"
]

[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
python_files = ["test_*.py"]
addopts = "-v --tb=short"

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I"]
ignore = ["E501"]

[tool.coverage.run]
source = ["appmanager"]
branch = true

[tool.coverage.report]
show_missing = true

