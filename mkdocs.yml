site_name: AppManager Documentation
site_description: Multi-tenant Flask sub-app portal & dynamic WSGI dispatcher with in-process isolation, telemetry, and automated health checks.
site_author: AppManager Contributors
site_url: https://github.com/r3sbarra/appmanager-server#readme
repo_url: https://github.com/r3sbarra/appmanager-server
repo_name: r3sbarra/appmanager-server

theme:
  name: material
  language: en
  palette:
    # Light mode
    - scheme: default
      primary: indigo
      accent: indigo
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    # Dark mode
    - scheme: slate
      primary: indigo
      accent: indigo
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
  features:
    - navigation.instant
    - navigation.tracking
    - navigation.tabs
    - navigation.sections
    - navigation.expand
    - navigation.top
    - search.suggest
    - search.highlight
    - content.code.copy

plugins:
  - search

markdown_extensions:
  - admonition
  - pymdownx.details
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.highlight:
      anchor_linenums: true
      line_spans: __span
      pygments_lang_class: true
  - pymdownx.inlinehilite
  - pymdownx.snippets
  - pymdownx.tabbed:
      alternate_style: true
  - tables
  - toc:
      permalink: true

nav:
  - Overview: index.md
  - Getting Started: getting-started.md
  - Configuration: configuration.md
  - Sub-App Development: sub-apps.md
  - Deployment & Scheduling: deployment.md
  - CLI Reference: cli.md
  - Python API Reference: api.md
