<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 240" width="100%" height="100%">
  <defs>
    <linearGradient id="bannerBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="50%" stop-color="#1e1b4b"/>
      <stop offset="100%" stop-color="#020617"/>
    </linearGradient>
    <linearGradient id="textGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="50%" stop-color="#818cf8"/>
      <stop offset="100%" stop-color="#c084fc"/>
    </linearGradient>
    <linearGradient id="iconGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#6366f1"/>
      <stop offset="100%" stop-color="#a855f7"/>
    </linearGradient>
  </defs>

  <rect width="1200" height="240" rx="16" fill="url(#bannerBg)" stroke="#334155" stroke-width="1.5"/>

  <!-- Logo Icon -->
  <g transform="translate(60, 50)">
    <rect width="140" height="140" rx="28" fill="url(#iconGrad)"/>
    <text x="70" y="92" text-anchor="middle" fill="#ffffff" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="52" font-weight="900" letter-spacing="2">AM</text>
  </g>

  <!-- Main Headline -->
  <g transform="translate(230, 85)">
    <text fill="url(#textGrad)" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="44" font-weight="800" letter-spacing="-0.5">AppManager</text>
    <text y="42" fill="#f8fafc" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="20" font-weight="600">Multi-Tenant WSGI Portal, Sub-App Container &amp; Extensible Plugin Framework</text>
    <text y="74" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="14" font-weight="400">Dynamic Routing • Scoped Namespaces • Pluggable UI Slots • Zero-Network Telemetry • Developer SDK</text>
  </g>

  <!-- Badges right aligned -->
  <g transform="translate(1000, 65)">
    <rect width="140" height="32" rx="16" fill="#1e293b" stroke="#334155"/>
    <text x="70" y="20" text-anchor="middle" fill="#38bdf8" font-family="sans-serif" font-size="12" font-weight="700">Python 3.10 - 3.13</text>

    <rect y="44" width="140" height="32" rx="16" fill="#1e293b" stroke="#334155"/>
    <text x="70" y="64" text-anchor="middle" fill="#4ade80" font-family="sans-serif" font-size="12" font-weight="700">WSGI &amp; PythonAnywhere</text>

    <rect y="88" width="140" height="32" rx="16" fill="#1e293b" stroke="#334155"/>
    <text x="70" y="108" text-anchor="middle" fill="#c084fc" font-family="sans-serif" font-size="12" font-weight="700">Plug &amp; Play SDK</text>
  </g>
</svg>
